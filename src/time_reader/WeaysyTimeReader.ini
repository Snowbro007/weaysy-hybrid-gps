; Local DX11 prototype. Boundaries are examples, not astronomical sunset.
; Restart/reload the telemetry plugin after editing this file.
[Clock]
DayStart=06:00
NightStart=20:00
; ATS 1.61.3.18: use the live local game zone, including after teleporting.
; Unknown executables fall back to raw SDK time with a warning, never guessed offsets.
UseLocalTimeZone=1

; Explicit local test override. 0 disables it; 1..60 alternate using GAME time.
; With 2: minutes0..1 DAY,2..3 NIGHT,4..5 DAY, etc. Never a real-time timer.
[Test]
SwitchEveryGameMinutes=0
